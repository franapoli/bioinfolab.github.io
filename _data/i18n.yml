  about:
    heading: About
    intro: >-
      The Bioinformatics Lab at University of Sannio is led by Luigi Cerulo and
      Francesco Napolitano, focusing on Systems Biology, AI-driven omics data
      analysis, and Computational Drug Discovery.
    areas:
      - img: sysbio.png
        title: Systems Biology
        text: Exploring biological data to uncover complex molecular mechanisms
      - img: ai.png
        title: AI-driven omics data analysis
        text: Leveraging Artificial Intelligence to make biological predictions from omics data.
      - img: compdd.png
        title: Computational Drug Discovery
        text: Indentifying small molecules for clinical and laboratory applications.
    history: >-
      Bioinformatics research activities at the University of Sannio were
      initiated in 2000 by Michele Ceccarelli and focused on the study of
      informatic processes in biological systems. As biological data began to
      grow exponentially, the lab focused toward data science approaches in
      bioinformatics under the co-direction of Luigi Cerulo from 2009. Starting
      in 2021, the Bioinformatics Lab has been led by Luigi Cerulo and Francesco
      Napolitano and employs advanced techniques to explore biological data,
      predict molecular mechanisms, and identify novel drugs and therapeutic
      targets, driving innovation in bioinformatics research.
