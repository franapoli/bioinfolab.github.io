  header:
    lead: DST UniSannio
    heading: Laboratorio di Bioinformatica
    button: Scopri di più
  about:
    heading: Chi siamo
    intro: >-
      Il Laboratorio di Bioinformatica dell'Università del Sannio è diretto da
      Luigi Cerulo e Francesco Napolitano e si occupa di biologia dei sistemi,
      analisi di dati omici basata sull'intelligenza artificiale e drug
      discovery computazionale.
    areas:
      - img: sysbio.png
        title: Biologia dei sistemi
        text: Esploriamo i dati biologici per svelare meccanismi molecolari complessi.
      - img: ai.png
        title: Analisi di dati omici con l'IA
        text: Usiamo l'intelligenza artificiale per fare previsioni biologiche a partire dai dati omici.
      - img: compdd.png
        title: Drug discovery computazionale
        text: Identifichiamo piccole molecole per applicazioni cliniche e di laboratorio.
    history: >-
      Le attività di ricerca in bioinformatica all'Università del Sannio sono
      state avviate nel 2000 da Michele Ceccarelli, con un focus sullo studio dei
      processi informatici nei sistemi biologici. Con la crescita esponenziale dei
      dati biologici, il laboratorio si è orientato verso gli approcci di data
      science in bioinformatica, sotto la co-direzione di Luigi Cerulo a partire
      dal 2009. Dal 2021 il Laboratorio di Bioinformatica è diretto da Luigi
      Cerulo e Francesco Napolitano e impiega tecniche avanzate per esplorare i
      dati biologici, predire meccanismi molecolari e identificare nuovi farmaci
      e bersagli terapeutici, contribuendo all'innovazione della ricerca in
      bioinformatica.
