<!-- Facilities Section (texts in _data/i18n.yml) -->
    <section id="facilities"  class="bg-light-gray">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">{{ t.facilities.heading }}</h2>
                    <h3 class="section-subheading text-muted"><br></h3>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <ul class="timeline">
                        {% for item in t.facilities.items %}
                        <li{% if forloop.index0 != 1 %} class="timeline-inverted"{% endif %}>
                            <div class="timeline-image">
                                <img class="img-circle img-responsive" src="{{ site.baseurl }}/img/about/{{ item.img }}" alt="">
                            </div>
                            <div class="timeline-panel">
                                <div class="timeline-heading">
                                    <h4 class="subheading">{{ item.title }}</h4>
                                </div>
                                <div class="timeline-body">
                                    <p class="text-muted">{{ item.text }}</p>
                                </div>
                            </div>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </section>
