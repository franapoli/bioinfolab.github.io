<!-- Theses Section -->
<section id="theses" class="bg-light-gray">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Theses</h2>
                <h3 class="section-subheading text-muted"><br></h3>
            </div>
        </div>
        <div class="row">
            {% assign theses = site.theses | sort: 'date' | reverse %}
            {% for thesis in theses %}
                <div class="col-md-4 col-sm-6 thesis-item">
                    <div class="thesis-card" data-toggle="modal" data-target="#thesisModal{{ forloop.index }}">
                        <div class="thesis-card-top">
                            <img src="{{ site.baseurl }}/img/team/{{ thesis.pic }}.jpg" class="thesis-avatar" alt="{{ thesis.author }}">
                            <h5>{{ thesis.title }}</h5>
                        </div>
                        <p class="text-muted">
                            {{ thesis.author }}<br>
                            {{ thesis.degree }}, A.A. {{ thesis.academic_year }}
                        </p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
