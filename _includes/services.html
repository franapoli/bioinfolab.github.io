<!-- About Section (texts in _data/i18n.yml) -->
    <section id="services">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">{{ t.about.heading }}</h2>

{{ t.about.intro }}<br><br><br><br>

                </div>
            </div>
            <div class="row text-center">
                {% for area in t.about.areas %}
                <div class="col-md-4">
                    <span class="fa-stack fa-4x">
                      <img src="{{ site.baseurl }}/img/areas/{{ area.img }}" class="img-responsive" alt="">
                    </span>
                    <h4 class="service-heading">{{ area.title }}</h4>
                    <p class="text-muted">{{ area.text }}</p>
                </div>
                {% endfor %}

        </div>

                    <div class="row">
                <div class="col-lg-12 text-center">
                  <br><br>
{{ t.about.history }}

                </div>
            </div>

    </section>
